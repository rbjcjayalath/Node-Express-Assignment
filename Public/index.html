<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #1a1a2e; color: white; }
        .card { background: #16213e; padding: 30px; border-radius: 15px; text-align: center; width: 350px; }
        input { width: 80%; padding: 10px; margin: 20px 0; border-radius: 5px; border: none; }
        button { background: #4ecca3; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome</h1>
        <p>Please enter your name to receive a greeting.</p>
        <input type="text" id="userName" placeholder="Enter your name"> <br>
        <button onclick="sendName()">Get Greeting</button>
    </div>

    <script>
        function sendName() {
            const nameValue = document.getElementById('userName').value;
            fetch('/api/submit-name', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: nameValue })
            }).then(() => {
                window.location.href = "greeting.html"; 
            });
        }
    </script>
</body>
</html>
